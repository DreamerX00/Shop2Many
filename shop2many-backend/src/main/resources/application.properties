spring.application.name=shop2many-backend
# PostgresSQL JDBC URL
# ========== Datasource Configuration ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop2Many}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mydb123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========== JPA / Hibernate ==========
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ========== Flyway Migrations ==========
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ========== Redis (Cache, Pub/Sub) ==========
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis

# ========== Spring Security / JWT ==========
jwt.secret=${JWT_SECRET:ReplaceWithStrongSecret}
jwt.expiration-ms=3600000

# ========== Actuator & Health Checks ==========
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ========== OpenAPI / Swagger ==========
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ========== Server Settings ==========
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ========== Logging ==========
logging.level.org.springframework=INFO
logging.level.com.shop2many=DEBUG

# ========== Optional: AWS S3 / LocalStack ==========
# spring.cloud.aws.stack-name=local
# cloud.aws.s3.endpoint=http://localhost:4566
# cloud.aws.s3.path-style-access-enabled=true

# ========== Additional Custom Settings ==========
app.pagination.default-page-size=20
app.pagination.max-page-size=100

