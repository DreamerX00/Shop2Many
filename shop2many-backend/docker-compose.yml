# docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: shop2many/backend:latest
    container_name: shop2many-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: shop2many-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop2Many
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mydb123
    volumes:
      - shop2many-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: shop2many-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  shop2many-db-data:
